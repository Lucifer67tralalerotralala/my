name: Build Studio Desk for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check and build frontend
        run: npm run build

      - name: Build Windows x64 installer
        run: npx electron-builder --win nsis --x64

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: StudioDesk-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
